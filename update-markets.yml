name: Update markets
on:
  schedule:
    - cron: "17 * * * *"          # backup: GitHub runs these late or skips them when busy
  push:
    paths:
      - alpha_live.json           # main trigger: the Chromebook bridge pushes this every hour
  workflow_dispatch:
concurrency:
  group: update-markets           # never two runs at once; a new one waits for the last
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 make_markets.py
        env:
          ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
      - run: python3 make_desk.py
        continue-on-error: true
      - run: python3 match_markets.py
        continue-on-error: true
      - run: python3 make_gaps.py
        continue-on-error: true
      - run: python3 post_new_markets.py
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add markets.json
          [ -f desk.json ] && git add desk.json
          [ -f posted.json ] && git add posted.json
          [ -f matches.json ] && git add matches.json
          [ -f gaps.json ] && git add gaps.json
          [ -f calendar.json ] && git add calendar.json
          [ -f movers.json ] && git add movers.json
          [ -f alpha_hist.json ] && git add alpha_hist.json
          git diff --cached --quiet || (git commit -m "Update markets" && git pull --rebase -q && git push)
