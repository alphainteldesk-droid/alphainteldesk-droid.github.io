name: site-review (throwaway)
on:
  push:
    branches: [site-review]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet playwright && python -m playwright install --with-deps chromium > /dev/null
      - run: python3 review_shot.py
      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: out/
