name: Update desk
on:
  schedule:
    - cron: "*/15 14-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 make_desk.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add desk.json
          git diff --cached --quiet || (git commit -m "Update desk" && git pull --rebase -q && git push)
