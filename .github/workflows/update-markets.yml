name: Update markets
on:
  schedule:
    - cron: "*/20 * * * *"        # every 20 min: fresh Polymarket/Kalshi odds, gaps, movers, calendar (GitHub may run these a little late)
  push:
    paths:
      - alpha_live.json           # main trigger: the Chromebook bridge pushes this every hour
  workflow_dispatch:
concurrency:
  group: update-markets           # never two runs at once; a new one waits for the last
  cancel-in-progress: false
permissions:
  contents: write
  issues: write                   # watchdog.py opens an issue (= alert to James) when a feed breaks
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # always start from the newest main (a queued run would otherwise start from an older commit)
      - run: python3 make_markets.py
        env:
          ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
      - run: python3 make_desk.py
        continue-on-error: true
      - run: python3 match_markets.py
        continue-on-error: true
      - run: python3 exit_grade.py   # Nov 15: Danger Zone Exit grade (live order-book depth, 2-min cap)
        continue-on-error: true
      - run: python3 weather.py   # Nov 22: weather for the homepage clocks (MET Norway)
        continue-on-error: true
      - run: python3 dz_chop.py   # Nov 22: Danger Zone Chop (48h price swing + mini-chart points, 1-min cap)
        continue-on-error: true
      - run: python3 make_gaps.py
        continue-on-error: true
      - run: timeout 240 python3 most_traded.py   # Nov 24: most traded today on Polymarket + Kalshi (hourly)
        continue-on-error: true
      - run: |                    # Nov 24: Gas Watch (EIA regions weekly, AAA daily, gasoline futures, gas-price markets)
          python3 -m pip install --quiet --break-system-packages xlrd || python3 -m pip install --quiet xlrd
          timeout 120 python3 gas.py
        continue-on-error: true
      - run: |                    # Nov 24: War Room heat map (flights, news, searches, radar, markets, ships, oil, VIX, gold, dates)
          python3 -m pip install --quiet --break-system-packages websockets || python3 -m pip install --quiet websockets
          timeout 300 python3 warroom.py
        continue-on-error: true
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
      - run: python3 gap_chart.py   # Nov 21: Live Gap Chart (real 7-day price history for every gap)
        continue-on-error: true
      - run: python3 week_gaps.py   # Nov 22: 8-day log of listed gaps for the Sunday weekly recap (recap.py)
        continue-on-error: true
      - run: python3 make_ics.py   # Nov 21: "Add to my calendar" feed (catalyst-calendar.ics) from calendar.json
        continue-on-error: true
      - run: python3 track_record.py   # Nov 15: Danger Zone track record (did listed contracts pay out?)
        continue-on-error: true
      - run: python3 motw.py   # Nov 19: Market of the Week (formula pick, verified twice, hourly price, archive)
        continue-on-error: true
      - run: |                    # share-preview images (card.jpg, card-gaps.jpg) for links posted on X etc.
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 make_card.py
        continue-on-error: true
      - run: python3 indexnow.py   # once a day: tell Bing & co. about our pages (Nov 10)
        continue-on-error: true
      - run: python3 top_traders.py   # Nov 14: weekly leaderboards for the Top Traders section (about once an hour)
        continue-on-error: true
        env:
          TRADERS_EXCLUDE: ${{ secrets.TRADERS_EXCLUDE }}
      - run: python3 fresh_wallets.py   # Nov 14: new wallets making large trades on markets closing soon
        continue-on-error: true
        env:
          FRESH_PARAMS: ${{ secrets.FRESH_PARAMS }}
      - run: python3 post_new_markets.py
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - run: python3 watchdog.py   # Nov 12: health check, safe self-fixes, instant alert via GitHub issue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add markets.json
          [ -f desk.json ] && git add desk.json
          [ -f posted.json ] && git add posted.json
          [ -f matches.json ] && git add matches.json
          [ -f gaps.json ] && git add gaps.json
          [ -f gap_chart.json ] && git add gap_chart.json gap_chart_hist.json
          [ -f calendar.json ] && git add calendar.json
          [ -f catalyst-calendar.ics ] && git add catalyst-calendar.ics
          [ -f week_gaps.json ] && git add week_gaps.json
          [ -f movers.json ] && git add movers.json
          [ -f warroom.json ] && git add warroom.json warroom_hist.json
          [ -f gas.json ] && git add gas.json
          [ -f most_traded.json ] && git add most_traded.json
          [ -f card_state.json ] && git add card.jpg card-gaps.jpg card_state.json index.html gap-scanner.html
          [ -f alpha_hist.json ] && git add alpha_hist.json
          [ -f indexnow_state.json ] && git add indexnow_state.json
          [ -f fine_watch.json ] && git add fine_watch.json
          [ -f health.json ] && git add health.json
          [ -f alpha_trades.json ] && git add alpha_trades.json
          [ -f traders.json ] && git add traders.json
          [ -f traders_full.json ] && git add traders_full.json
          [ -f fresh.json ] && git add fresh.json fresh_state.json
          [ -f expiry.json ] && git add expiry.json
          [ -f dz_alpha_hist.json ] && git add dz_alpha_hist.json
          [ -f weather.json ] && git add weather.json
          [ -f track.json ] && git add track.json
          [ -f rules.json ] && git add rules.json
          [ -f motw.json ] && git add motw.json sitemap.xml
          [ -d motw ] && git add motw
          git diff --cached --quiet || (git commit -m "Update markets" && git pull --rebase -X theirs -q && git push)   # if another run pushed meanwhile, keep this run's fresher files
