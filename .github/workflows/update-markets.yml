name: Update markets
on:
  schedule:
    - cron: "*/20 * * * *"        # every 20 min: fresh Polymarket/Kalshi odds, gaps, movers, calendar (GitHub may run these a little late)
  push:
    paths:
      - alpha_live.json           # main trigger: the Chromebook bridge pushes this every hour
  workflow_dispatch:
concurrency:
  group: update-markets           # never two runs at once; a new one waits for the last
  cancel-in-progress: false
permissions:
  contents: write
  issues: write                   # watchdog.py opens an issue (= alert to James) when a feed breaks
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # always start from the newest main (a queued run would otherwise start from an older commit)
      - run: python3 make_markets.py
        env:
          ALPHA_API_KEY: ${{ secrets.ALPHA_API_KEY }}
      - run: python3 make_desk.py
        continue-on-error: true
      - run: python3 match_markets.py
        continue-on-error: true
      - run: python3 make_gaps.py
        continue-on-error: true
      - run: |                    # share-preview images (card.jpg, card-gaps.jpg) for links posted on X etc.
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 make_card.py
        continue-on-error: true
      - run: python3 indexnow.py   # once a day: tell Bing & co. about our pages (Nov 10)
        continue-on-error: true
      - run: python3 post_new_markets.py
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - run: python3 watchdog.py   # Nov 12: health check, safe self-fixes, instant alert via GitHub issue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add markets.json
          [ -f desk.json ] && git add desk.json
          [ -f posted.json ] && git add posted.json
          [ -f matches.json ] && git add matches.json
          [ -f gaps.json ] && git add gaps.json
          [ -f calendar.json ] && git add calendar.json
          [ -f movers.json ] && git add movers.json
          [ -f card_state.json ] && git add card.jpg card-gaps.jpg card_state.json index.html gap-scanner.html
          [ -f alpha_hist.json ] && git add alpha_hist.json
          [ -f indexnow_state.json ] && git add indexnow_state.json
          [ -f fine_watch.json ] && git add fine_watch.json
          [ -f health.json ] && git add health.json
          git diff --cached --quiet || (git commit -m "Update markets" && git pull --rebase -X theirs -q && git push)   # if another run pushed meanwhile, keep this run's fresher files
