name: Gap chart test (throwaway branch)
on:
  push:
    branches: [gapchart-test]
    paths: [gap_chart.py, gapchart.js, index.html, gap-scanner.html, tools/gapchart_shot.py, .github/workflows/gapchart-test.yml]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git fetch --depth 1 origin main
          git checkout origin/main -- gaps.json matches.json alpha_hist.json alpha_live.json
          python3 gap_chart.py
      - run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 tools/gapchart_shot.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f out gap_chart.json gap_chart_hist.json
          git commit -m "gapchart test output" && git push
