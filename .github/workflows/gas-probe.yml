name: gas probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet xlrd
      - run: python3 gas.py
      - run: python3 -c "import json;d=json.load(open('gas.json'));print(json.dumps({k:d.get(k) for k in ('eia','aaa','rbob','pressure')})[:3000]);print(json.dumps(d.get('markets',[])[:12])[:3000])"
