name: gas probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet xlrd
      - run: python3 gas.py
      - run: |
          python3 - <<'PY'
          import json; d = json.load(open('gas.json')); d['eia']['series'] = {}
          print('GASJSON ' + json.dumps(d))
          PY
