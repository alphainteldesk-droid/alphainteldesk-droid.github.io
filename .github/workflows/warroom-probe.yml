name: War Room probe (throwaway)
on:
  push:
    branches: [warroom-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q websockets
      - run: python3 warroom.py --all
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
      - run: python3 -c "import json;d=json.load(open('warroom.json'));print(json.dumps({k:d[k] for k in ('chokepoints','live_ships','hormuz_markets','usdc')},ensure_ascii=False)[:6000])"
      - uses: actions/upload-artifact@v4
        with:
          name: warroom
          path: warroom.json
